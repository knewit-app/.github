name: ✨ Feature Request
description: 새 기능이나 개선을 제안합니다
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - FE (React Native)
        - BE (Spring)
        - BE (FastAPI)
        - Infra / CI
        - 여러 영역에 걸침 · 미정
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 배경 / 문제
      description: 어떤 문제나 불편을 해결하려는 건가요? 기능 자체보다 "왜"를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방향
      description: 생각하는 해결책. 확정이 아니어도 괜찮습니다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 무엇이 되면 이 이슈를 닫을 수 있나요?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안 / 영향 범위
      description: 검토했다가 접은 방법, 다른 레포에 미치는 영향, API 변경 여부 등
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 참고 자료
      description: 디자인 시안, 레퍼런스 링크, 관련 이슈
    validations:
      required: false
